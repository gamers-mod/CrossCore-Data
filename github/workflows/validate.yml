name: Validate Repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/publish_all.py scripts/validate_release.py
      - name: Secret-Leaks und Dateinamen prüfen
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E '(BUNGIE_API_KEY|WARGAMING_APPLICATION_ID)=[^$]' . --exclude-dir=.git
          test -f .github/workflows/publish-destiny-wednesday.yml
          test -f .github/workflows/publish-wargaming-monday.yml
