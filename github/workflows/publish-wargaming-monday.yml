name: Publish WoT and WoWS Data - Monday

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: crosscore-wargaming-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten erzeugen
        env:
          WARGAMING_APPLICATION_ID: ${{ secrets.WARGAMING_APPLICATION_ID }}
        run: python scripts/publish_all.py --target wargaming
      - name: Daten prüfen
        run: python scripts/validate_release.py release_data --target wargaming
      - name: Release erstellen oder Assets aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view data-latest >/dev/null 2>&1; then
            gh release upload data-latest release_data/wargaming_data_manifest.json release_data/wot_catalog.json.gz release_data/wows_catalog.json.gz --clobber
          else
            gh release create data-latest release_data/wargaming_data_manifest.json release_data/wot_catalog.json.gz release_data/wows_catalog.json.gz --title "CrossCore Data - Latest" --notes "Automatisch erzeugte öffentliche CrossCore-Datendateien." --latest
          fi
